services:
  backend:
    build: ./backend
    container_name: parcel-kiosk
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data                     # SQLite 数据库持久化
      - ./backend/.env:/app/.env:ro      # 配置文件只读挂载
    environment:
      # Docker 内 localhost 不是 NAS 主机，打印机需要指定 IP
      - PRINTER_HOST=${NAS_PRINTER_IP:-192.168.3.146}
      # 快递公司 -> 货架层映射
      - COURIER_LAYER_MAP=顺丰:1-1,中通:1-2,圆通:1-3,申通:1-4
      - DB_PATH=/data/parcel.db
      - SERVER_BASE_URL=https://kiosk.rayspring.dpdns.org
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - backend
