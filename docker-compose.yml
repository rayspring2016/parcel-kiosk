version: "3.9"

services:
  backend:
    build: ./backend
    container_name: parcel-kiosk
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data          # SQLite 数据库持久化
      - ./backend/.env:/app/.env:ro  # 配置文件只读挂载
    environment:
      - DB_PATH=/data/parcel.db
      - SERVER_BASE_URL=http://192.168.3.27:8000
